_target_: fastwam.runtime.create_robomme_fastwam_idm

# Pinned Hugging Face sources. The RoboMME path deliberately disables
# DiffSynth's ModelScope/local-checkpoints resolver for Wan components.
model_id: Wan-AI/Wan2.2-TI2V-5B
model_revision: 921dbaf3f1674a56f47e83fb80a34bac8a8f203e
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_revision: 37ec512624d61f7aa208f7ea8140a131f93afc9a
hf_cache_dir: null

tokenizer_max_len: 128
load_text_encoder: false
video_cond_noise_prob: 1.0
mot_checkpoint_mixed_attn: false
compile_training_denoise: false
vae_encode_mode: eager
action_dit_pretrained_path: null
skip_dit_load_from_pretrain: false

# Fixed RoboMME input/output contract.
camera_order: [front, wrist]
mosaic_size: [224, 448]
state_dim: 8
action_dim: 8
action_horizon: 16
action_representation: absolute

video_dit_config:
  has_image_input: false
  patch_size: [1, 2, 2]
  in_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: false
  video_attention_mask_mode: first_frame_causal
  action_conditioned: false
  action_dim: 8
  action_group_causal_mask_mode: group_diagonal

action_dit_config:
  action_dim: 8
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: false

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 1.0
  infer_shift: 1.0
  num_train_timesteps: 1000

# The scheduler core supports shifted-logit-normal sampling. Selection remains
# deferred until the MemoryWAM training path is wired, so no inert keys live here.

loss:
  lambda_video: 1.0
  lambda_action: 1.0
